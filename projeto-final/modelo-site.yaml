---
# ============================================================
# BLOCO 2 — Deployment: mantém 2 Pods nginx rodando.
#
# - replicas: 2        -> duas cópias da página, com balanceamento.
# - selector/labels    -> o Service encontra os Pods por estas labels.
# - volumeMounts       -> monta o ConfigMap dentro do nginx.
# - volumes            -> declara de onde vem o volume "site".
#
# Se um Pod cair, o Deployment cria outro automaticamente.
# TODO: confira se as labels do selector e do template são iguais.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-alunoXX
  labels:
    app: app-alunoXX
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-alunoXX
  template:
    metadata:
      labels:
        app: app-alunoXX
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html/alunoXX
      volumes:
        - name: site
          configMap:
            name: site-alunoXX

---
# ============================================================
# BLOCO 3 — Service: o endereço estável da aplicação.
#
# O Ingress não fala com o Pod: ele fala com o Service.
# O Service seleciona os Pods pela label app=app-alunoXX e
# balanceia as conexões entre eles.
#
# - type: ClusterIP    -> acesso interno (o Ingress usa).
# - port: 80           -> porta do Service.
# - targetPort: 80     -> porta em que o nginx escuta no Pod.
# TODO: o selector precisa ser igual à label dos Pods.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: svc-alunoXX
  labels:
    app: app-alunoXX
spec:
  type: ClusterIP
  selector:
    app: app-alunoXX
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

---
# ============================================================
# BLOCO 4 — Ingress: publica a página no caminho /alunoXX.
#
# O Ingress Controller lê esta regra e encaminha:
#   https://curso.chr.eti.br/alunoXX/ -> svc-alunoXX:80
#
# - ingressClassName: use a classe do seu cluster (public ou nginx).
# - host: curso.chr.eti.br (o mesmo do proxy reverso do professor).
# - path: /alunoXX (o mesmo nome da pasta dentro do nginx).
#
# TODO: confira a classe com: kubectl get ingressclass
# TODO: se a classe for nginx, troque public por nginx.
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-alunoXX
spec:
  ingressClassName: public
  rules:
    - host: curso.chr.eti.br
      http:
        paths:
          - path: /alunoXX
            pathType: Prefix
            backend:
              service:
                name: svc-alunoXX
                port:
                  number: 80
